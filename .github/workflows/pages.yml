name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: |
          node tests/geo.test.mjs
          node tests/hash.test.mjs
          node tests/dom.test.mjs
      - name: Assemble static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          for f in index.html 404.html favicon.svg .nojekyll manifest.webmanifest sw.js robots.txt LICENSE; do
            if [ -f "$f" ]; then cp -a "$f" _site/; fi
          done
          for d in css js vendor; do
            cp -a "$d" _site/
          done
          test -f _site/index.html
          test -f _site/vendor/maplibre/maplibre-gl.min.js
          test -f _site/js/main.js
          test -f _site/js/dom.js
          test -f _site/.nojekyll
          ls -la _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
